services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roama
      POSTGRES_PASSWORD: roama_local_dev
      POSTGRES_DB: roama
    ports:
      - "5432:5432"
    volumes:
      - roama_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roama -d roama"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  roama_postgres:
