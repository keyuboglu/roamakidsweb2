name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: roama
          POSTGRES_PASSWORD: roama_local_dev
          POSTGRES_DB: roama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roama -d roama_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://roama:roama_local_dev@localhost:5432/roama_test?schema=public
      TEST_DATABASE_URL: postgresql://roama:roama_local_dev@localhost:5432/roama_test?schema=public
      SESSION_SECRET: ci-placeholder-session-secret-at-least-32-chars
      ABUSE_HASH_SECRET: ci-placeholder-abuse-secret-at-least-32-chars
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-placeholder-admin-password
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npx --yes npm@11.19.0 ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
